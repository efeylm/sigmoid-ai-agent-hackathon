services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: ai_agent_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_agent_db
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai_agent_network

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_agent_backend
    env_file:
      - .env
    environment:
      # Always point at the compose database, whatever .env says
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ai_agent_db
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./app:/app/app # For hot reload in development
      - ./tests:/app/tests # Mount tests for running in container
    networks:
      - ai_agent_network
    restart: unless-stopped

  # Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # The browser calls the API directly, so this must be reachable from the host
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: ai_agent_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - ai_agent_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  ai_agent_network:
    driver: bridge
